# Default policy for mcp-sentinel-proxy, protecting vulnerable_target's
# four tools. Fail-closed: any tool not listed here is denied
# (default_action: deny), and a missing/invalid policy file falls back to
# an even stricter built-in default (see proxy/policy.py).
version: 1
default_action: deny
dry_run: false
max_calls_per_minute: 60

tools:
  read_file:
    enabled: true
    # allow_path_prefixes: [""] looks unusual but is deliberate. The proxy's
    # ".." traversal check only activates when allow_path_prefixes is set
    # (not None) -- see _check_containment in interceptor.py -- and an
    # empty-string prefix matches every path (see _is_within_prefix), so
    # this activates traversal blocking without imposing a real prefix
    # restriction. A real prefix restriction (e.g. ["sandbox/files"]) isn't
    # meaningful here: vulnerable_target's read_file already resolves its
    # `path` argument relative to a fixed SANDBOX_ROOT
    # (.../sandbox/files), so a legitimate argument is a bare filename like
    # "README.txt" that was never going to start with a "sandbox/files"
    # string prefix -- an earlier version of this policy used that prefix
    # and it denied every legitimate call, caught by
    # tests/proxy/test_stdio_proxy_integration.py::test_legitimate_read_within_sandbox_is_allowed_for_real.
    # This still blocks THREAT_MODEL.md's flagship "../secret.txt"
    # traversal (class #5) via the unconditional ".." check.
    allow_path_prefixes: [""]

  fetch_url:
    enabled: true
    # vulnerable_target's mock HTTP server always binds to 127.0.0.1; a
    # real deployment would list the specific external hosts a tool is
    # actually meant to call (THREAT_MODEL.md class #2, SSRF).
    allow_hosts: ["127.0.0.1", "localhost"]

  query_db:
    enabled: true
    # Blocks SQL injection payloads in the username argument
    # (THREAT_MODEL.md class #6) via a write/injection keyword heuristic.
    readonly: true

  run_command:
    enabled: false
    # Declared purpose ("list files") never matches its actual capability
    # (arbitrary shell execution via shell=True) -- see MCP-SENT-001 in
    # THREAT_MODEL.md class #1. Disabled outright rather than contained.

injection_detection:
  enabled: true
  block_on_detection: true
