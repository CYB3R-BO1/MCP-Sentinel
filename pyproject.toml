[project]
name = "mcp-sentinel"
version = "0.1.0"
description = "MCP Sentinel: security scanner and runtime guardrail platform for Model Context Protocol servers and tool-calling agents."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]
supply-chain = [
    "pip-audit>=2.7.0",
]
proxy = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "prometheus-client>=0.20.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
mcp-sentinel-scan = "scanner.cli:main"
mcp-sentinel-supply-chain = "supply_chain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
